<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Горизонтальное меню</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .nav {
            background-color: #2c3e50;
            width: 100%;
            padding: 10px 0;
            overflow: hidden; /* Для корректного отображения плавающих элементов */
        }

        .nav .links {
            display: block;
            float: left; /* Плавающий элемент влево */
            text-decoration: none;
            color: white;
            padding: 15px 25px;
            background-color: #34495e;
            border-right: 1px solid #4a6278;
            transition: background-color 0.3s;
        }

        .nav .links:hover {
            background-color: #1abc9c;
        }

        .nav .links:last-child {
            border-right: none;
        }

        /* Очистка потока после плавающих элементов */
        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }

        h1 {
            margin-top: 20px;
            color: #333;
        }

        p {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="nav clearfix">
        <a href="" class="links">Главная</a>
        <a href="" class="links">Новости</a>
        <a href="" class="links">Контакты</a>
        <a href="" class="links">Информация об авторе</a>
    </div>
    
    <h1>Горизонтальное меню с использованием float</h1>
    <p>Меню создано с помощью свойства float: left для элементов навигации.</p>
</body>
</html>
